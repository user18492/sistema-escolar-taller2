<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/form-field.css" />
    <link rel="stylesheet" href="../../shared/styles/buttons.css" />
    <link rel="stylesheet" href="./login.css" />
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/text-truncate.component.js"></script>
    <script src="./login.js" defer></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>

    <!-- Vista sin menú lateral: la tarjeta de acceso queda centrada en toda el área. -->
    <div class="app-shell">
      <main class="login-view">
        <section class="login-card" aria-labelledby="loginTitle">
          <div class="login-logo">
            <img src="../../../resources/logotipo_header.png" alt="Gestión educativa" draggable="false" />
          </div>

          <h1 class="login-title" id="loginTitle">Iniciar sesión</h1>

          <form class="login-form" id="loginForm" novalidate>
            <div class="field">
              <input type="email" id="loginEmail" placeholder="Email" aria-label="Email" aria-describedby="loginEmailError" autocomplete="username" spellcheck="false" />
            </div>
            <p class="login-field-error" id="loginEmailError" hidden></p>

            <div class="field field-password">
              <input type="password" id="loginPassword" placeholder="Contraseña" aria-label="Contraseña" aria-describedby="loginPasswordError" autocomplete="current-password" />
              <button class="password-toggle" type="button" id="passwordToggle" aria-controls="loginPassword" aria-pressed="false" aria-label="Mostrar contraseña" title="Mostrar contraseña">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <!-- resources/Eye.svg: mostrar contraseña -->
                  <g class="password-show-icon">
                    <path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                    <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  </g>
                  <!-- resources/EyeSlash.svg: ocultar contraseña -->
                  <path class="password-hide-icon" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
            <p class="login-field-error" id="loginPasswordError" hidden></p>

            <label class="login-remember">
              <input type="checkbox" id="rememberAccount" />
              <span class="login-checkbox" aria-hidden="true">
                <svg class="login-check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>
              </span>
              <span>Recordar mi cuenta</span>
            </label>

            <p class="login-error" id="loginError" role="alert" hidden></p>

            <button class="btn btn-primary login-submit" type="submit" id="loginSubmit">Login</button>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
