<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/sidebar.css" />
    <link rel="stylesheet" href="../../shared/styles/dashboard.css" />
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../shared/components/text-truncate.component.js"></script>
    <script src="../../shared/components/stat-card.component.js"></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>
    <div class="app-shell">
      <app-sidebar active="dashboard"></app-sidebar>

      <!-- Main -->
      <div class="main">
        <main class="content">
          <div class="page-header">
            <div>
              <h1>¡Bienvenida, Ana!</h1>
              <p>Resumen general de la institución</p>
            </div>
          </div>

          <section class="stat-grid">
            <stat-card icon="users" label="Usuarios activos" value="1,248"></stat-card>

            <stat-card icon="rectangle-stack" label="Cursos activos" value="48"></stat-card>

            <stat-card icon="academic-cap" label="Docentes asignados" value="86"></stat-card>

            <stat-card icon="clipboard-document-list" label="Asignaciones" value="124"></stat-card>
          </section>

          <section class="card attention-card">
            <div class="attention-header">
              <h2>Requiere atención</h2>
              <p>Indicadores de gestión que necesitan revisión</p>
            </div>

            <ul class="attention-list">
              <li class="attention-item">
                <span class="attention-icon">
                  <!-- resources/ExclamationTriangle.svg -->
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                </span>
                <span class="attention-text">3 cursos poseen materias sin docente asignado</span>
                <a class="attention-link" href="../assignments/index.html">
                  Ver docencia
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                  </svg>
                </a>
              </li>

              <li class="attention-item">
                <span class="attention-icon">
                  <!-- resources/ExclamationTriangle.svg -->
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                </span>
                <span class="attention-text">4 usuarios se encuentran suspendidos</span>
                <a class="attention-link" href="../users/index.html">
                  Ver usuarios
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                  </svg>
                </a>
              </li>
            </ul>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
