<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regularidad de los backups - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/sidebar.css" />
    <link rel="stylesheet" href="../../shared/styles/breadcrumb.css" />
    <link rel="stylesheet" href="../../shared/styles/form-field.css" />
    <link rel="stylesheet" href="../../shared/styles/column-filter.css" />
    <link rel="stylesheet" href="../../shared/styles/report-filters.css" />
    <link rel="stylesheet" href="../../shared/styles/chart.css" />
    <link rel="stylesheet" href="./backup-regularity-report.css" />
    <script src="../../shared/components/drag-guard.component.js"></script>
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/user-avatar.component.js"></script>
    <script src="../../shared/components/session-user-cache.component.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../shared/components/report-description.component.js"></script>
    <script src="../../shared/components/column-filter.js"></script>
    <script src="../../shared/components/column-filter-toggle.component.js"></script>
    <script src="../../shared/components/school-year.js"></script>
    <script src="./backup-regularity-report.js" defer></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>
    <div class="app-shell">
      <!-- Vista abierta desde Reportes: el menú sigue marcando esa sección. -->
      <app-sidebar active="reports"></app-sidebar>

      <!-- Main -->
      <div class="main">
        <main class="content">
          <div class="page-head">
            <nav class="breadcrumb" aria-label="Ruta de navegación">
              <a href="../reports/index.html">Reportes</a>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <span class="breadcrumb-current" aria-current="page">Regularidad de los backups</span>
            </nav>

            <div class="page-header">
              <div>
                <h1>Regularidad de los backups</h1>
                <p><report-description report="backup-regularity"></report-description></p>
              </div>
            </div>
          </div>

          <!-- Barra de filtros (report-filters.css): cada botón muestra el valor vigente -->
          <div class="report-filters" role="group" aria-label="Filtros del reporte">
            <div class="column-filter" data-filter="year">
              <column-filter-toggle target="yearFilter" heading="Ciclo lectivo" value="—" label="Filtrar por ciclo lectivo"></column-filter-toggle>
              <div id="yearFilter" class="column-filter-panel" popover="auto" role="group" aria-label="Filtrar por ciclo lectivo">
                <div class="field">
                  <input type="text" class="column-filter-input" data-format="year" inputmode="numeric" placeholder="AAAA" aria-label="Filtrar por ciclo lectivo (AAAA)" autocomplete="off" />
                </div>
                <button type="button" class="column-filter-clear">Limpiar filtro</button>
              </div>
            </div>
          </div>

          <!-- Indicador del último backup de la institución: no depende del filtro de ciclo lectivo -->
          <section class="card last-backup-card" aria-labelledby="lastBackupText">
            <span class="last-backup-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <polyline points="12 7 12 12 15 14" />
              </svg>
            </span>
            <div class="last-backup-text">
              <p id="lastBackupText" class="last-backup-summary" role="status">Cargando último backup…</p>
              <p class="last-backup-date" hidden></p>
            </div>
          </section>

          <!-- Gráfico de columnas (chart.css): una columna por mes del ciclo lectivo, sin encabezado,
               eje vertical ni grilla (el título y la descripción son los de la vista, y cada columna
               muestra su cantidad encima) -->
          <section class="card chart-card backup-chart-card" aria-label="Backups por mes">
            <p class="backup-chart-message" role="status">Cargando reporte…</p>

            <!-- backup-regularity-report.js completa las columnas y sus etiquetas -->
            <div class="chart backup-chart" hidden>
              <div class="chart-plot">
                <div class="chart-bars" role="list" aria-label="Backups por mes"></div>
                <div class="chart-labels" aria-hidden="true"></div>
              </div>
            </div>

            <div class="chart-legend" hidden>
              <span class="legend-item"><span class="legend-dot legend-dot-backups"></span>Backups</span>
              <span class="legend-item legend-item-future"><span class="legend-dot legend-dot-future"></span>Mes futuro</span>
            </div>

            <!-- Plantilla: backup-regularity-report.js la completa con una columna por mes -->
            <template id="backupColumnTemplate">
              <div class="chart-col" role="listitem">
                <div class="chart-bar-group">
                  <span class="backup-value"></span>
                  <div class="chart-bar backup-bar"></div>
                </div>
              </div>
            </template>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
