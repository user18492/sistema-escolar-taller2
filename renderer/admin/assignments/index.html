<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docencia - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/sidebar.css" />
    <link rel="stylesheet" href="../../shared/styles/grade-dropdown.css" />
    <link rel="stylesheet" href="../../shared/styles/course-filter.css" />
    <link rel="stylesheet" href="../../shared/styles/searchable-select.css" />
    <link rel="stylesheet" href="../../shared/styles/column-filter.css" />
    <link rel="stylesheet" href="../../shared/styles/modal-dropdown.css" />
    <link rel="stylesheet" href="../../shared/styles/confirm-modal.css" />
    <link rel="stylesheet" href="../../shared/styles/toast.css" />
    <link rel="stylesheet" href="../../shared/styles/form-field.css" />
    <link rel="stylesheet" href="../../shared/styles/dropdown.css" />
    <link rel="stylesheet" href="../../shared/styles/buttons.css" />
    <link rel="stylesheet" href="../../shared/styles/data-table.css" />
    <link rel="stylesheet" href="../../shared/styles/pagination.css" />
    <link rel="stylesheet" href="../../shared/styles/info-box.css" />
    <link rel="stylesheet" href="../../shared/styles/assignment-form.css" />
    <link rel="stylesheet" href="./assignments.css" />
    <script src="../../shared/components/drag-guard.component.js"></script>
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/user-avatar.component.js"></script>
    <script src="../../shared/components/session-user-cache.component.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../shared/components/text-truncate.component.js"></script>
    <script src="../../shared/components/grade-dropdown.js"></script>
    <script src="../../shared/components/course-filter.js"></script>
    <script src="../../shared/components/column-filter.js"></script>
    <script src="../../shared/components/modal-resize.js"></script>
    <script src="../../shared/components/modal-dropdown.js"></script>
    <script src="../../shared/components/modal-focus-trap.component.js"></script>
    <script src="../../shared/components/field-validation.component.js"></script>
    <script src="../../shared/components/dropdown.component.js"></script>
    <script src="../../shared/components/searchable-select.component.js"></script>
    <script src="../../shared/components/confirm-modal.component.js"></script>
    <script src="../../shared/components/toast.component.js"></script>
    <script src="../../shared/components/column-filter-toggle.component.js"></script>
    <script src="../../shared/components/search-bar.component.js"></script>
    <script src="../../shared/components/table-pagination.component.js"></script>
    <script src="../../shared/components/row-actions.component.js"></script>
    <script src="../../shared/components/school-year.js"></script>
    <script src="../../shared/components/assignment-form.component.js"></script>
    <script src="./assignments.js" defer></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>
    <div class="app-shell">
      <app-sidebar active="assignments"></app-sidebar>

      <!-- Main -->
      <div class="main">
        <main class="content">
          <div class="page-header">
            <div>
              <h1>Docencia</h1>
              <p>Gestiona las asignaciones docentes de la institución</p>
            </div>

            <button class="btn btn-primary" type="button" id="openNewAssignmentModalBtn">
              <span class="plus">+</span> Nueva asignación
            </button>
          </div>

          <section class="card assignments-card">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col" class="column-filter col-teacher" data-filter="teacher">
                      <column-filter-toggle target="teacherFilter" heading="Profesor" label="Filtrar por profesor"></column-filter-toggle>
                      <div id="teacherFilter" class="column-filter-panel column-filter-searchable" popover="auto" role="group" aria-label="Filtrar por profesor">
                        <search-bar placeholder="Buscar por profesor"></search-bar>
                        <ul class="dropdown-menu dropdown-menu-teacher" role="listbox" aria-label="Profesor">
                          <li class="dropdown-empty" hidden>Sin resultados</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th scope="col" class="column-filter" data-filter="course">
                      <column-filter-toggle target="courseFilter" heading="Curso" label="Filtrar por curso"></column-filter-toggle>
                      <div id="courseFilter" class="column-filter-panel column-filter-grade" popover="auto" role="group" aria-label="Filtrar por curso">
                        <course-filter></course-filter>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th>Nivel educativo</th>
                    <th scope="col" class="column-filter" data-filter="subject">
                      <column-filter-toggle target="subjectFilter" heading="Materia" label="Filtrar por materia"></column-filter-toggle>
                      <div id="subjectFilter" class="column-filter-panel" popover="auto" role="group" aria-label="Filtrar por materia">
                        <ul class="dropdown-menu" role="listbox" aria-label="Materia" aria-multiselectable="true">
                          <li class="dropdown-option" role="option" data-value="" aria-selected="false">Todas</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th scope="col" class="column-filter" data-filter="year">
                      <column-filter-toggle target="yearFilter" heading="Ciclo lectivo" label="Filtrar por ciclo lectivo"></column-filter-toggle>
                      <div id="yearFilter" class="column-filter-panel" popover="auto" role="group" aria-label="Filtrar por ciclo lectivo">
                        <div class="field">
                          <input type="text" class="column-filter-input" data-format="year" inputmode="numeric" placeholder="AAAA" aria-label="Filtrar por ciclo lectivo (AAAA)" autocomplete="off" />
                        </div>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <table-pagination results="" label="Paginación de asignaciones docentes" pages="1"></table-pagination>

            <!-- Plantilla: assignments.js la completa con lo que devuelve el proceso principal, una
                 fila por asignación docente. Las opciones de los filtros Profesor y Materia, una por
                 cada profesor y por cada materia que tienen alguna, son las del formulario
                 (assignment-form.component.js) -->
            <template id="assignmentRowTemplate">
              <tr>
                <td class="col-teacher col-truncate">
                  <div class="avatar-item">
                    <span class="avatar-circle"></span>
                    <div class="avatar-item-text">
                      <span class="teacher-name text-truncate"></span>
                      <span class="teacher-email text-truncate"></span>
                    </div>
                  </div>
                </td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>
                  <row-actions edit-label="Editar asignación" delete-label="Borrar asignación"></row-actions>
                </td>
              </tr>
            </template>
          </section>
        </main>
      </div>
    </div>

    <!-- Modal: Nueva asignación / Editar asignación. El formulario es el componente compartido
         assignment-form.component.js -->
    <div class="modal-overlay" id="newAssignmentOverlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="newAssignmentTitle">
        <assignment-form></assignment-form>
      </div>
    </div>

    <!-- Modal: Eliminar asignación -->
    <confirm-modal entity="Assignment" heading="Eliminar asignación" description="¿Quieres eliminar esta asignación?"></confirm-modal>
  </body>
</html>
