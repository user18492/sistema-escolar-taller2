<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materias sin docente - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/sidebar.css" />
    <link rel="stylesheet" href="../../shared/styles/breadcrumb.css" />
    <link rel="stylesheet" href="../../shared/styles/form-field.css" />
    <link rel="stylesheet" href="../../shared/styles/dropdown.css" />
    <link rel="stylesheet" href="../../shared/styles/column-filter.css" />
    <link rel="stylesheet" href="../../shared/styles/report-filters.css" />
    <link rel="stylesheet" href="../../shared/styles/data-table.css" />
    <link rel="stylesheet" href="../../shared/styles/pagination.css" />
    <link rel="stylesheet" href="./subject-coverage-report.css" />
    <script src="../../shared/components/drag-guard.component.js"></script>
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/user-avatar.component.js"></script>
    <script src="../../shared/components/session-user-cache.component.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../shared/components/report-description.component.js"></script>
    <script src="../../shared/components/column-filter.js"></script>
    <script src="../../shared/components/column-filter-toggle.component.js"></script>
    <script src="../../shared/components/text-truncate.component.js"></script>
    <script src="../../shared/components/table-pagination.component.js"></script>
    <script src="../../shared/components/school-year.js"></script>
    <script src="./subject-coverage-report.js" defer></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>
    <div class="app-shell">
      <!-- Vista abierta desde Reportes: el menú sigue marcando esa sección. -->
      <app-sidebar active="reports"></app-sidebar>

      <!-- Main -->
      <div class="main">
        <main class="content">
          <div class="page-head">
            <nav class="breadcrumb" aria-label="Ruta de navegación">
              <a href="../reports/index.html">Reportes</a>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <span class="breadcrumb-current" aria-current="page">Materias sin docente por curso</span>
            </nav>

            <div class="page-header">
              <div>
                <h1>Materias sin docente por curso</h1>
                <p><report-description report="subject-coverage"></report-description></p>
              </div>
            </div>
          </div>

          <!-- Barra de filtros (report-filters.css): cada botón muestra el valor vigente -->
          <div class="report-filters" role="group" aria-label="Filtros del reporte">
            <div class="column-filter" data-filter="year">
              <column-filter-toggle target="yearFilter" heading="Ciclo lectivo" value="—" label="Filtrar por ciclo lectivo"></column-filter-toggle>
              <div id="yearFilter" class="column-filter-panel" popover="auto" role="group" aria-label="Filtrar por ciclo lectivo">
                <div class="field">
                  <input type="text" class="column-filter-input" data-format="year" inputmode="numeric" placeholder="AAAA" aria-label="Filtrar por ciclo lectivo (AAAA)" autocomplete="off" />
                </div>
                <button type="button" class="column-filter-clear">Limpiar filtro</button>
              </div>
            </div>
            <div class="column-filter" data-filter="level">
              <column-filter-toggle target="levelFilter" heading="Nivel" value="Todos" label="Filtrar por nivel"></column-filter-toggle>
              <div id="levelFilter" class="column-filter-panel" popover="auto" role="group" aria-label="Filtrar por nivel">
                <ul class="dropdown-menu" role="listbox" aria-label="Nivel">
                  <li class="dropdown-option" role="option" data-value="" aria-selected="false">Todos</li>
                  <li class="dropdown-option" role="option" data-value="PRIMARY" aria-selected="false">Primaria</li>
                  <li class="dropdown-option" role="option" data-value="SECONDARY" aria-selected="false">Secundaria</li>
                </ul>
                <button type="button" class="column-filter-clear">Limpiar filtro</button>
              </div>
            </div>
            <div class="column-filter" data-filter="shift">
              <column-filter-toggle target="shiftFilter" heading="Turno" value="Todos" label="Filtrar por turno"></column-filter-toggle>
              <div id="shiftFilter" class="column-filter-panel" popover="auto" role="group" aria-label="Filtrar por turno">
                <ul class="dropdown-menu" role="listbox" aria-label="Turno">
                  <li class="dropdown-option" role="option" data-value="" aria-selected="false">Todos</li>
                  <li class="dropdown-option" role="option" data-value="MORNING" aria-selected="false">Mañana</li>
                  <li class="dropdown-option" role="option" data-value="AFTERNOON" aria-selected="false">Tarde</li>
                </ul>
                <button type="button" class="column-filter-clear">Limpiar filtro</button>
              </div>
            </div>
            <label class="report-switch" for="onlyIncompleteSwitch">
              <input type="checkbox" role="switch" id="onlyIncompleteSwitch" checked />
              Solo cursos incompletos
            </label>
          </div>

          <section class="card coverage-card">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col">Curso</th>
                    <th scope="col">Nivel</th>
                    <th scope="col">Materias del plan</th>
                    <th scope="col">Asignadas</th>
                    <th scope="col" class="col-subjects">Sin docente</th>
                    <th scope="col" class="col-subjects">Con docente suspendido</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <table-pagination results="" label="Paginación de cursos" pages="1"></table-pagination>

            <!-- Plantilla: subject-coverage-report.js la completa con una fila por curso del reporte -->
            <template id="coverageRowTemplate">
              <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td class="col-subjects col-truncate"><span class="unassigned-subjects text-truncate"></span></td>
                <td class="col-subjects col-truncate"><span class="suspended-subjects text-truncate"></span></td>
              </tr>
            </template>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
