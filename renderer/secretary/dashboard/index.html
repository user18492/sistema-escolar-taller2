<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/sidebar.css" />
    <link rel="stylesheet" href="../../shared/styles/toast.css" />
    <link rel="stylesheet" href="../../shared/styles/dashboard.css" />
    <script src="../../shared/components/drag-guard.component.js"></script>
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/user-avatar.component.js"></script>
    <script src="../../shared/components/session-user-cache.component.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../shared/components/text-truncate.component.js"></script>
    <script src="../../shared/components/toast.component.js"></script>
    <script src="../../shared/components/stat-card.component.js"></script>
    <script src="../../shared/components/dashboard-greeting.component.js"></script>
    <script src="../../shared/components/dashboard-summary.component.js"></script>
    <script src="./dashboard.js" defer></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>
    <div class="app-shell">
      <app-sidebar nav-role="secretary" active="dashboard"></app-sidebar>

      <!-- Main -->
      <div class="main">
        <main class="content">
          <div class="page-header">
            <div>
              <!-- dashboard.js le agrega el nombre del usuario de la sesión -->
              <h1 id="welcomeTitle">¡Hola!</h1>
              <p>Resumen general de la institución</p>
            </div>
          </div>

          <section class="stat-grid">
            <!-- "value" lo completa dashboard-summary.component.js con el dato de data-stat; hasta entonces, una raya -->
            <stat-card icon="clipboard-document" label="Inscripciones activas" value="—" data-stat="activeEnrollmentCount"></stat-card>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
