<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alumnos - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/sidebar.css" />
    <link rel="stylesheet" href="../../shared/styles/searchable-select.css" />
    <link rel="stylesheet" href="../../shared/styles/column-filter.css" />
    <link rel="stylesheet" href="../../shared/styles/modal-dropdown.css" />
    <link rel="stylesheet" href="../../shared/styles/confirm-modal.css" />
    <link rel="stylesheet" href="../../shared/styles/toast.css" />
    <link rel="stylesheet" href="../../shared/styles/form-field.css" />
    <link rel="stylesheet" href="../../shared/styles/dropdown.css" />
    <link rel="stylesheet" href="../../shared/styles/buttons.css" />
    <link rel="stylesheet" href="../../shared/styles/tab-list.css" />
    <link rel="stylesheet" href="../../shared/styles/data-table.css" />
    <link rel="stylesheet" href="../../shared/styles/badge.css" />
    <link rel="stylesheet" href="../../shared/styles/pagination.css" />
    <link rel="stylesheet" href="../../shared/styles/student-form.css" />
    <link rel="stylesheet" href="./students.css" />
    <script src="../../shared/components/drag-guard.component.js"></script>
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/user-avatar.component.js"></script>
    <script src="../../shared/components/session-user-cache.component.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../shared/components/text-truncate.component.js"></script>
    <script src="../../shared/components/column-filter.js"></script>
    <script src="../../shared/components/modal-resize.js"></script>
    <script src="../../shared/components/modal-dropdown.js"></script>
    <script src="../../shared/components/modal-focus-trap.component.js"></script>
    <script src="../../shared/components/field-validation.component.js"></script>
    <script src="../../shared/components/dropdown.component.js"></script>
    <script src="../../shared/components/confirm-modal.component.js"></script>
    <script src="../../shared/components/toast.component.js"></script>
    <script src="../../shared/components/column-filter-toggle.component.js"></script>
    <script src="../../shared/components/search-bar.component.js"></script>
    <script src="../../shared/components/tab-list.component.js"></script>
    <script src="../../shared/components/table-pagination.component.js"></script>
    <script src="../../shared/components/row-actions.component.js"></script>
    <script src="../../shared/components/status-badge.component.js"></script>
    <script src="../../shared/components/student-form.component.js"></script>
    <script src="../../shared/components/student-delete.component.js"></script>
    <script src="./students.js" defer></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>
    <div class="app-shell">
      <app-sidebar nav-role="secretary" active="students"></app-sidebar>

      <!-- Main -->
      <div class="main">
        <main class="content">
          <div class="page-header">
            <div>
              <h1>Alumnos</h1>
              <p>Gestiona los alumnos de la institución</p>
            </div>

            <button class="btn btn-primary" type="button" id="openNewStudentModalBtn">
              <span class="plus">+</span> Nuevo alumno
            </button>
          </div>

          <section class="card students-card">
            <!-- Pestañas: students.js lista los alumnos de la elegida y escribe cuántos tiene cada una -->
            <div class="tab-list" role="tablist" aria-label="Alumnos vigentes o eliminados">
              <button type="button" class="tab" role="tab" id="currentStudentsTab" data-tab="current" aria-selected="true" aria-controls="studentsTabPanel">
                Vigentes
                <span class="tab-count"></span>
              </button>
              <button type="button" class="tab" role="tab" id="deletedStudentsTab" data-tab="deleted" aria-selected="false" aria-controls="studentsTabPanel" tabindex="-1">
                Eliminados
                <span class="tab-count"></span>
              </button>
            </div>

            <div class="table-wrap" id="studentsTabPanel" role="tabpanel" aria-labelledby="currentStudentsTab">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col" class="column-filter col-name" data-filter="name">
                      <column-filter-toggle target="nameFilter" heading="Nombre" label="Filtrar por nombre"></column-filter-toggle>
                      <div id="nameFilter" class="column-filter-panel column-filter-searchable" popover="auto" role="group" aria-label="Filtrar por nombre">
                        <search-bar placeholder="Buscar por nombre"></search-bar>
                        <ul class="dropdown-menu dropdown-menu-student" role="listbox" aria-label="Nombre">
                          <li class="dropdown-empty" hidden>Sin resultados</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th scope="col" class="column-filter col-email" data-filter="email">
                      <column-filter-toggle target="emailFilter" heading="Email" label="Filtrar por email"></column-filter-toggle>
                      <div id="emailFilter" class="column-filter-panel column-filter-searchable" popover="auto" role="group" aria-label="Filtrar por email">
                        <search-bar placeholder="Buscar por email"></search-bar>
                        <ul class="dropdown-menu dropdown-menu-student" role="listbox" aria-label="Email">
                          <li class="dropdown-empty" hidden>Sin resultados</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th scope="col" class="column-filter" data-filter="phone">
                      <column-filter-toggle target="phoneFilter" heading="Teléfono" label="Filtrar por teléfono"></column-filter-toggle>
                      <div id="phoneFilter" class="column-filter-panel column-filter-searchable" popover="auto" role="group" aria-label="Filtrar por teléfono">
                        <search-bar placeholder="Buscar por teléfono"></search-bar>
                        <ul class="dropdown-menu dropdown-menu-student" role="listbox" aria-label="Teléfono">
                          <li class="dropdown-empty" hidden>Sin resultados</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th class="col-address">Dirección</th>
                    <th scope="col" class="column-filter" data-filter="dni">
                      <column-filter-toggle target="dniFilter" heading="DNI" label="Filtrar por DNI"></column-filter-toggle>
                      <div id="dniFilter" class="column-filter-panel column-filter-searchable" popover="auto" role="group" aria-label="Filtrar por DNI">
                        <search-bar placeholder="Buscar por DNI"></search-bar>
                        <ul class="dropdown-menu dropdown-menu-student" role="listbox" aria-label="DNI">
                          <li class="dropdown-empty" hidden>Sin resultados</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th>Fecha de nacimiento</th>
                    <th scope="col" class="column-filter" data-filter="status">
                      <column-filter-toggle target="statusFilter" heading="Estado" label="Filtrar por estado"></column-filter-toggle>
                      <div id="statusFilter" class="column-filter-panel" popover="auto" role="group" aria-label="Filtrar por estado">
                        <ul class="dropdown-menu" role="listbox" aria-label="Estado" aria-multiselectable="true">
                          <li class="dropdown-option" role="option" data-value="" aria-selected="false">Todos</li>
                          <li class="dropdown-option" role="option" data-value="ACTIVE" aria-selected="false">Activo</li>
                          <li class="dropdown-option" role="option" data-value="GRADUATED" aria-selected="false">Egresado</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <table-pagination results="" label="Paginación de alumnos" pages="1"></table-pagination>

            <!-- Plantillas: students.js las completa con los alumnos de la pestaña elegida: una fila y
                 una opción de los filtros Nombre, Email, Teléfono y DNI por cada alumno. Las dos
                 pestañas comparten las columnas; con restore-label, <row-actions> genera solo
                 Restaurar, así que las filas de Vigentes lo pierden y llevan Editar y Eliminar -->
            <template id="studentRowTemplate">
              <tr>
                <td class="student-name col-name col-truncate"><span class="text-truncate"></span></td>
                <td class="col-email col-truncate"><span class="text-truncate"></span></td>
                <td></td>
                <td class="col-address col-truncate"><span class="text-truncate"></span></td>
                <td></td>
                <td></td>
                <td>
                  <status-badge></status-badge>
                </td>
                <td>
                  <row-actions edit-label="Editar alumno" delete-label="Eliminar alumno" restore-label="Restaurar alumno"></row-actions>
                </td>
              </tr>
            </template>
            <template id="studentOptionTemplate">
              <li class="dropdown-option option-student" role="option" aria-selected="false">
                <span class="option-name text-truncate"></span>
                <span class="option-detail text-truncate"></span>
              </li>
            </template>
          </section>
        </main>
      </div>
    </div>
    <!-- Modal: Nuevo alumno / Editar alumno, con el formulario compartido <student-form>
         (student-form.component.js) -->
    <div class="modal-overlay" id="newStudentOverlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="newStudentTitle">
        <student-form></student-form>
      </div>
    </div>

    <!-- Modal: Eliminar alumno (la baja la pide student-delete.component.js) -->
    <confirm-modal entity="Student" heading="Eliminar alumno" description="¿Quieres eliminar este alumno?" consequence="Si tiene una inscripción activa, se cancelará."></confirm-modal>
    <!-- Modal: Restaurar alumno -->
    <confirm-modal entity="Student" action="restore" heading="Restaurar alumno" description="¿Quieres restaurar este alumno?" consequence="Si al eliminarlo se canceló su inscripción activa, seguirá cancelada."></confirm-modal>
  </body>
</html>
