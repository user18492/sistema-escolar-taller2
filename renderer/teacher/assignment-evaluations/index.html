<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluaciones - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/sidebar.css" />
    <link rel="stylesheet" href="../../shared/styles/searchable-select.css" />
    <link rel="stylesheet" href="../../shared/styles/column-filter.css" />
    <link rel="stylesheet" href="../../shared/styles/assignment-summary.css" />
    <link rel="stylesheet" href="../../shared/styles/confirm-modal.css" />
    <link rel="stylesheet" href="../../shared/styles/form-field.css" />
    <link rel="stylesheet" href="../../shared/styles/dropdown.css" />
    <link rel="stylesheet" href="../../shared/styles/buttons.css" />
    <link rel="stylesheet" href="../../shared/styles/data-table.css" />
    <link rel="stylesheet" href="../../shared/styles/pagination.css" />
    <link rel="stylesheet" href="../../shared/styles/info-box.css" />
    <link rel="stylesheet" href="../../shared/styles/breadcrumb.css" />
    <link rel="stylesheet" href="./assignment-evaluations.css" />
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/user-avatar.component.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../shared/components/text-truncate.component.js"></script>
    <script src="../../shared/components/column-filter.js"></script>
    <script src="../../shared/components/modal-resize.js"></script>
    <script src="../../shared/components/modal-focus-trap.component.js"></script>
    <script src="../../shared/components/field-validation.component.js"></script>
    <script src="../../shared/components/confirm-modal.component.js"></script>
    <script src="../../shared/components/column-filter-toggle.component.js"></script>
    <script src="../../shared/components/search-bar.component.js"></script>
    <script src="../../shared/components/table-pagination.component.js"></script>
    <script src="../../shared/components/assignment-summary.component.js"></script>
    <script src="../../shared/components/manage-link.component.js"></script>
    <script src="../../shared/components/row-actions.component.js"></script>
    <script src="./assignment-evaluations.js" defer></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>
    <div class="app-shell">
      <!-- Vista de gestión abierta desde Asignaciones: el menú sigue marcando esa sección. -->
      <app-sidebar nav-role="teacher" active="assignments"></app-sidebar>

      <!-- Main -->
      <div class="main">
        <main class="content">
          <div class="page-head">
            <nav class="breadcrumb" aria-label="Ruta de navegación">
              <a href="../assignments/index.html">Asignaciones</a>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <a href="../assignment-management/index.html">Gestión</a>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <span class="breadcrumb-current" aria-current="page">Evaluaciones</span>
            </nav>

            <div class="page-header">
              <div>
                <h1>Evaluaciones</h1>
                <p>Gestiona las evaluaciones correspondientes a esta asignación</p>
              </div>
            </div>
          </div>

          <!-- Solo si no se pudo cargar la asignación: reemplaza a la tarjeta, al alta y a la tabla -->
          <p class="form-error" id="assignmentLoadError" role="alert" hidden></p>

          <!-- Datos de la asignación seleccionada: assignment-evaluations.js los completa con los
               que devuelve el proceso principal para la asignación elegida en Asignaciones; hasta
               entonces, una raya -->
          <assignment-summary course="—" level="—" subject="—" year="—"></assignment-summary>

          <div class="evaluations-actions">
            <button class="btn btn-primary" type="button" id="openNewEvaluationModalBtn">
              <span class="plus">+</span> Nueva evaluación
            </button>
          </div>

          <!-- Evaluaciones vigentes de la asignación: assignment-evaluations.js las carga del proceso
               principal -->
          <section class="card evaluations-card">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col" class="column-filter col-title" data-filter="title">
                      <column-filter-toggle target="titleFilter" heading="Título" label="Filtrar por título"></column-filter-toggle>
                      <div id="titleFilter" class="column-filter-panel column-filter-searchable" popover="auto" role="group" aria-label="Filtrar por título">
                        <search-bar placeholder="Filtrar por título"></search-bar>
                        <!-- Una opción por evaluación de la asignación, con su fecha como dato secundario:
                             assignment-evaluations.js las agrega antes de .dropdown-empty -->
                        <ul class="dropdown-menu dropdown-menu-evaluation" role="listbox" aria-label="Título">
                          <li class="dropdown-empty" hidden>Sin resultados</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <table-pagination results="" label="Paginación de evaluaciones" pages="1"></table-pagination>

            <!-- Plantillas: assignment-evaluations.js las completa con lo que devuelve el proceso
                 principal: una fila y una opción del filtro Título por cada evaluación de la
                 asignación. "Gestionar" abre las calificaciones de esa evaluación -->
            <template id="evaluationRowTemplate">
              <tr>
                <td class="evaluation-title col-title col-truncate"><span class="text-truncate"></span></td>
                <td></td>
                <td>
                  <row-actions manage-href="../evaluation-scores/index.html" edit-label="Editar evaluación" delete-label="Eliminar evaluación"></row-actions>
                </td>
              </tr>
            </template>
            <template id="evaluationOptionTemplate">
              <li class="dropdown-option option-evaluation" role="option" aria-selected="false">
                <span class="option-name text-truncate"></span>
                <span class="option-detail text-truncate"></span>
              </li>
            </template>
          </section>
        </main>
      </div>
    </div>
    <!-- Modal compartido: Nueva evaluación / Editar evaluación -->
    <div class="modal-overlay" id="evaluationOverlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="evaluationModalTitle">
        <div class="modal-header">
          <h2 id="evaluationModalTitle">Nueva evaluación</h2>
          <p>Completa los datos para crear una nueva evaluación</p>
        </div>

        <div class="modal-body">
          <div class="form-field">
            <label for="evaluationTitleInput">Título</label>
            <div class="field">
              <input type="text" id="evaluationTitleInput" placeholder="Ej. Evaluación escrita 2" autocomplete="off" data-validate="title" required />
            </div>
          </div>

          <div class="form-field">
            <label for="evaluationDateInput">Fecha de evaluación</label>
            <div class="field field-date">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="16" rx="2" />
                <line x1="16" y1="3" x2="16" y2="7" />
                <line x1="8" y1="3" x2="8" y2="7" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              <input type="text" id="evaluationDateInput" placeholder="DD/MM" inputmode="numeric" autocomplete="off" aria-describedby="evaluationCycleDescription" data-validate="day-month" data-year-source="evaluationYear" required />
            </div>
          </div>

          <!-- El año de la fecha no se ingresa: se toma del ciclo lectivo actual. -->
          <div class="info-box">
            <span class="info-box-icon">
              <!-- resources/CalendarDays.svg -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
              </svg>
            </span>
            <div class="info-box-text">
              <p id="evaluationCycleDescription"><span>Se creará para el ciclo lectivo:</span> <strong id="evaluationYear">2026</strong></p>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelEvaluationBtn">Cancelar</button>
          <button type="button" class="btn btn-primary" id="saveEvaluationBtn" disabled>Crear evaluación</button>
        </div>
      </div>
    </div>
    <!-- Modal: Eliminar evaluación -->
    <confirm-modal entity="Evaluation" heading="Eliminar evaluación" description="¿Quieres eliminar esta evaluación?"></confirm-modal>
  </body>
</html>
