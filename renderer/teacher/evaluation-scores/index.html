<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calificaciones - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/sidebar.css" />
    <link rel="stylesheet" href="../../shared/styles/searchable-select.css" />
    <link rel="stylesheet" href="../../shared/styles/column-filter.css" />
    <link rel="stylesheet" href="../../shared/styles/assignment-summary.css" />
    <link rel="stylesheet" href="../../shared/styles/toast.css" />
    <link rel="stylesheet" href="../../shared/styles/dropdown.css" />
    <link rel="stylesheet" href="../../shared/styles/data-table.css" />
    <link rel="stylesheet" href="../../shared/styles/pagination.css" />
    <link rel="stylesheet" href="../../shared/styles/breadcrumb.css" />
    <link rel="stylesheet" href="../../shared/styles/form-field.css" />
    <link rel="stylesheet" href="./evaluation-scores.css" />
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/user-avatar.component.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../shared/components/text-truncate.component.js"></script>
    <script src="../../shared/components/field-validation.component.js"></script>
    <script src="../../shared/components/column-filter.js"></script>
    <script src="../../shared/components/toast.component.js"></script>
    <script src="../../shared/components/column-filter-toggle.component.js"></script>
    <script src="../../shared/components/search-bar.component.js"></script>
    <script src="../../shared/components/table-pagination.component.js"></script>
    <script src="../../shared/components/assignment-summary.component.js"></script>
    <script src="./evaluation-scores.js" defer></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>
    <div class="app-shell">
      <!-- Vista abierta desde Evaluaciones: el menú sigue marcando Asignaciones. -->
      <app-sidebar nav-role="teacher" active="assignments"></app-sidebar>

      <!-- Main -->
      <div class="main">
        <main class="content">
          <div class="page-head">
            <nav class="breadcrumb" aria-label="Ruta de navegación">
              <a href="../assignments/index.html">Asignaciones</a>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <a href="../assignment-management/index.html">Gestión</a>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <a href="../assignment-evaluations/index.html">Evaluaciones</a>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <!-- La evaluación no tiene vista propia: queda como paso del recorrido.
                   evaluation-scores.js pone su título cuando llega del proceso principal; hasta
                   entonces, una raya. -->
              <span class="breadcrumb-item text-truncate" data-field="evaluation">—</span>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <span class="breadcrumb-current" aria-current="page">Calificaciones</span>
            </nav>

            <div class="page-header">
              <div>
                <h1>Calificaciones</h1>
                <p>Registra y consulta las calificaciones de la evaluación seleccionada</p>
              </div>
            </div>
          </div>

          <!-- Solo si no se pudo cargar la asignación: reemplaza a la tarjeta y a la tabla -->
          <p class="form-error" id="assignmentLoadError" role="alert" hidden></p>

          <!-- Contexto completo en una sola card: a la izquierda los datos de la asignación
               y a la derecha los de la evaluación elegida. evaluation-scores.js completa los
               de la asignación con los que devuelve el proceso principal para la elegida en
               Asignaciones, y los de la evaluación con los de la elegida en Evaluaciones;
               hasta entonces, una raya. -->
          <assignment-summary course="—" level="—" subject="—" year="—" evaluation="—" evaluation-date="—"></assignment-summary>

          <!-- Calificaciones de la evaluación, una fila por cada inscripción del curso de la
               asignación: evaluation-scores.js las carga del proceso principal -->
          <section class="card scores-card">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col" class="column-filter col-student" data-filter="student">
                      <column-filter-toggle target="studentFilter" heading="Alumno" label="Filtrar por alumno"></column-filter-toggle>
                      <div id="studentFilter" class="column-filter-panel column-filter-searchable" popover="auto" role="group" aria-label="Filtrar por alumno">
                        <search-bar placeholder="Filtrar por alumno"></search-bar>
                        <!-- Mismo filtro que Alumnos de la asignación, con una opción por
                             inscripción; el dato secundario es el DNI, que es lo que esta tabla
                             muestra junto al alumno. evaluation-scores.js las agrega antes de
                             .dropdown-empty -->
                        <ul class="dropdown-menu dropdown-menu-student" role="listbox" aria-label="Alumno">
                          <li class="dropdown-empty" hidden>Sin resultados</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th class="col-dni">DNI</th>
                    <th class="col-score">Calificación</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <table-pagination results="" label="Paginación de calificaciones" pages="1"></table-pagination>

            <!-- Plantillas: evaluation-scores.js las completa con lo que devuelve el proceso
                 principal: una fila y una opción del filtro Alumno por cada inscripción del curso.
                 La calificación se carga y se corrige en la propia celda con el numeric stepper
                 (escritura manual o botones − y +) y se guarda al salir del campo; el campo vacío
                 indica que todavía no fue registrada. -->
            <template id="scoreRowTemplate">
              <tr>
                <td class="student-name col-student col-truncate"><span class="text-truncate"></span></td>
                <td></td>
                <td class="col-score">
                  <div class="numeric-stepper">
                    <input class="numeric-stepper-input" type="text" inputmode="decimal" autocomplete="off" role="spinbutton" aria-valuemin="0" aria-valuemax="10" />
                    <button type="button" class="numeric-stepper-btn" tabindex="-1">
                      <!-- resources/Minus.svg -->
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14" />
                      </svg>
                    </button>
                    <button type="button" class="numeric-stepper-btn" tabindex="-1">
                      <!-- resources/Plus.svg -->
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 4.5v15m7.5-7.5h-15" />
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
            </template>
            <template id="studentOptionTemplate">
              <li class="dropdown-option option-student" role="option" aria-selected="false">
                <span class="option-name text-truncate"></span>
                <span class="option-detail text-truncate"></span>
              </li>
            </template>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
