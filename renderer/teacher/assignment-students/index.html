<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alumnos - Gestión Escolar</title>
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/titlebar.css" />
    <link rel="stylesheet" href="../../shared/styles/sidebar.css" />
    <link rel="stylesheet" href="../../shared/styles/searchable-select.css" />
    <link rel="stylesheet" href="../../shared/styles/column-filter.css" />
    <link rel="stylesheet" href="../../shared/styles/assignment-summary.css" />
    <link rel="stylesheet" href="../../shared/styles/dropdown.css" />
    <link rel="stylesheet" href="../../shared/styles/data-table.css" />
    <link rel="stylesheet" href="../../shared/styles/pagination.css" />
    <link rel="stylesheet" href="../../shared/styles/breadcrumb.css" />
    <link rel="stylesheet" href="../../shared/styles/form-field.css" />
    <link rel="stylesheet" href="./assignment-students.css" />
    <script src="../../shared/components/titlebar.component.js"></script>
    <script src="../../shared/components/user-avatar.component.js"></script>
    <script src="../../shared/components/sidebar.js"></script>
    <script src="../../shared/components/text-truncate.component.js"></script>
    <script src="../../shared/components/field-validation.component.js"></script>
    <script src="../../shared/components/column-filter.js"></script>
    <script src="../../shared/components/column-filter-toggle.component.js"></script>
    <script src="../../shared/components/search-bar.component.js"></script>
    <script src="../../shared/components/table-pagination.component.js"></script>
    <script src="../../shared/components/assignment-summary.component.js"></script>
    <script src="./assignment-students.js" defer></script>
  </head>
  <body>
    <app-titlebar></app-titlebar>
    <div class="app-shell">
      <!-- Vista de consulta abierta desde Asignaciones: el menú sigue marcando esa sección. -->
      <app-sidebar nav-role="teacher" active="assignments"></app-sidebar>

      <!-- Main -->
      <div class="main">
        <main class="content">
          <div class="page-head">
            <nav class="breadcrumb" aria-label="Ruta de navegación">
              <a href="../assignments/index.html">Asignaciones</a>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <a href="../assignment-management/index.html">Gestión</a>
              <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
              <span class="breadcrumb-current" aria-current="page">Alumnos</span>
            </nav>

            <div class="page-header">
              <div>
                <h1>Alumnos</h1>
                <p>Consulta los alumnos asociados al curso de esta asignación.</p>
              </div>
            </div>
          </div>

          <!-- Solo si no se pudo cargar la asignación: reemplaza a la tarjeta y a la tabla -->
          <p class="form-error" id="assignmentLoadError" role="alert" hidden></p>

          <!-- Datos de la asignación seleccionada: assignment-students.js los completa con los
               que devuelve el proceso principal para la asignación elegida en Asignaciones; hasta
               entonces, una raya -->
          <assignment-summary course="—" level="—" subject="—" year="—"></assignment-summary>

          <!-- Inscripciones del curso de la asignación, en cualquier estado: assignment-students.js
               las carga del proceso principal -->
          <section class="card students-card">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Nro inscripción</th>
                    <th scope="col" class="column-filter col-student" data-filter="student">
                      <column-filter-toggle target="studentFilter" heading="Alumno" label="Filtrar por alumno"></column-filter-toggle>
                      <div id="studentFilter" class="column-filter-panel column-filter-searchable" popover="auto" role="group" aria-label="Filtrar por alumno">
                        <search-bar placeholder="Filtrar por alumno"></search-bar>
                        <ul class="dropdown-menu dropdown-menu-student" role="listbox" aria-label="Alumno">
                          <li class="dropdown-empty" hidden>Sin resultados</li>
                        </ul>
                        <button type="button" class="column-filter-clear">Limpiar filtro</button>
                      </div>
                    </th>
                    <th>DNI</th>
                    <th>Fecha inscripción</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <table-pagination results="" label="Paginación de alumnos" pages="1"></table-pagination>

            <!-- Plantillas: assignment-students.js las completa con lo que devuelve el proceso
                 principal: una fila y una opción del filtro Alumno por cada inscripción del curso -->
            <template id="enrollmentRowTemplate">
              <tr>
                <td class="enrollment-number"></td>
                <td class="col-student col-truncate"><span class="text-truncate"></span></td>
                <td></td>
                <td></td>
              </tr>
            </template>
            <template id="studentOptionTemplate">
              <li class="dropdown-option option-student" role="option" aria-selected="false">
                <span class="option-name text-truncate"></span>
                <span class="option-detail text-truncate"></span>
              </li>
            </template>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
